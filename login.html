<head>
<meta charset="utf-8">

<title>SRB WiFi Zone</title>
<script>
// মাইক্রোটিক এই মানগুলো নিজে বসায়। লগইন ব্যর্থ হলে error-এ কারণ থাকে।
var e="$(error)", u="$(username)";
function real(v){return v && v.indexOf('$(')!==0;}
var q=[];
if(real(e)) q.push('error='+encodeURIComponent(e));
if(real(u)) q.push('username='+encodeURIComponent(u));
location.replace('https://srshehab71.github.io/srbwifi.login/'+(q.length?'?'+q.join('&'):''));
</script>
</head>
